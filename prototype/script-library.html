<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>脚本库与复盘</title>
    <link rel="stylesheet" href="./styles.css?v=review-note-learning-v1" />
  </head>
  <body>
    <div class="product-shell">
      <aside class="left-menu">
        <div class="menu-brand">
          <span class="caption">CONTENTWORK</span>
          <strong>内容工作台</strong>
        </div>
        <nav>
          <a href="./v2.html?v=review-note-learning-v1">
            <span>00</span>
            V2 工作台
          </a>
          <a href="./trend-pool.html?v=content-pool-v1">
            <span>01</span>
            热点池
          </a>
          <a href="./content-pool.html?v=content-pool-v1">
            <span>02</span>
            对标内容池
          </a>
          <a href="./brand-center.html?v=brand-center-v1">
            <span>03</span>
            品牌商品
          </a>
          <a href="./index.html?v=brand-center-v1">
            <span>04</span>
            脚本流程
          </a>
          <a href="./ai-tools.html?v=brand-center-v1">
            <span>05</span>
            AI 生成能力
          </a>
          <a class="active" href="./script-library.html?v=review-note-learning-v1">
            <span>06</span>
            脚本库复盘
          </a>
          <a href="./collection-center.html?v=brand-center-v1">
            <span>07</span>
            采集任务
          </a>
        </nav>
      </aside>

      <main class="flow-shell">
        <header class="flow-hero">
          <div>
            <span class="caption">SCRIPT LIBRARY</span>
            <h1>脚本库与复盘</h1>
            <p>这里不做生成，只管理历史脚本：审核状态、发布链接、表现数据和优质模板。</p>
          </div>
          <span class="api-status" id="libraryApiStatus">读取脚本库...</span>
        </header>

        <section class="flow-step">
          <div class="step-head">
            <span class="step-index">LIB</span>
            <div>
              <span class="caption">FILTER</span>
              <h2>脚本资产</h2>
              <p>把当前生成页和历史资产分开，运营在这里做采用、发布和复盘。</p>
            </div>
          </div>
          <div class="library-learning-panel" id="libraryLearningPanel">
            <div class="readiness-loading">正在读取复盘学习数据...</div>
          </div>
          <div class="library-filter-row" aria-label="脚本库筛选">
            <button class="active" type="button" data-library-filter="">全部</button>
            <button type="button" data-library-filter="new">新脚本</button>
            <button type="button" data-library-filter="adopted">已采用</button>
            <button type="button" data-library-filter="needs_edit">待改</button>
            <button type="button" data-library-filter="rejected">弃用</button>
            <button type="button" data-library-filter="published">已发布</button>
            <button type="button" data-library-filter="template">模板</button>
          </div>
          <div class="library-stats" id="libraryStats"></div>
          <div class="library-bulk-bar" id="libraryBulkBar">
            <div>
              <strong id="librarySelectedCount">已选 0 条</strong>
              <span>先勾选脚本，再批量标记审核结果。</span>
            </div>
            <div class="library-bulk-actions">
              <button type="button" data-library-select-all>全选当前列表</button>
              <button type="button" data-library-clear-selection>清空选择</button>
              <button type="button" data-library-bulk-review="adopted">批量采用</button>
              <button type="button" data-library-bulk-review="needs_edit">批量待改</button>
              <button type="button" data-library-bulk-review="rejected">批量弃用</button>
            </div>
          </div>
          <div class="library-list" id="libraryList"></div>
        </section>
      </main>
    </div>

    <script src="./script-library.js?v=review-note-learning-v1"></script>
  </body>
</html>
