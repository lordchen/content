<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>品牌活动 v3.4｜内容中台</title>
    <link rel="stylesheet" href="./simple-agent-v3.4.css" />
  </head>
  <body>
    <div class="v34-app" data-page="campaigns">
      <aside class="v34-side">
        <a class="v34-brand" href="./simple-agent-v3.4-materials.html">
          <span class="v34-brand-mark">中</span>
          <span><strong>内容中台</strong><small>v3.4 简化版</small></span>
        </a>
        <nav class="v34-nav" aria-label="新版本菜单">
          <a href="./simple-agent-v3.4-materials.html"><span class="v34-nav-icon"></span><span>素材库</span></a>
          <a class="active" href="./simple-agent-v3.4-campaigns.html"><span class="v34-nav-icon"></span><span>品牌活动</span></a>
          <a href="./simple-agent-v3.4-generate.html"><span class="v34-nav-icon"></span><span>脚本生成</span></a>
          <a href="./simple-agent-v3.4-scripts.html"><span class="v34-nav-icon"></span><span>脚本库</span></a>
        </nav>
        <div class="v34-version">
          <a class="v34-legacy-link" href="./v1/index.html">查看旧版本</a>
        </div>
      </aside>

      <main class="v34-main">
        <header class="v34-topbar">
          <div class="v34-title">
            <h1>品牌活动</h1>
            <p>维护脚本生成需要读取的商品活动和矩阵号。</p>
          </div>
          <div class="v34-top-actions">
            <label class="v34-global-search" for="campaignGlobalSearch">
              <span aria-hidden="true">⌕</span>
              <input id="campaignGlobalSearch" type="search" placeholder="搜索活动、商品、品牌" />
            </label>
            <div class="v34-user-menu">
              <button class="v34-user" id="userButton" type="button" aria-haspopup="menu" aria-expanded="false">
                <span class="v34-avatar" id="userAvatar">管</span>
                <span id="userName">管理员</span>
                <span class="v34-user-caret" aria-hidden="true"></span>
              </button>
              <div class="v34-user-panel" id="userMenuPanel" role="menu" hidden>
                <div class="v34-user-panel-head">
                  <strong id="userMenuName">管理员</strong>
                  <span id="userMenuMeta">admin</span>
                </div>
                <button class="v34-user-menu-action" id="logoutButton" type="button" role="menuitem">退出登录</button>
              </div>
            </div>
          </div>
        </header>

        <div class="v34-content">
          <section class="v34-card">
            <div class="v34-card-body v34-campaign-board">
              <div class="v34-tabline" role="tablist" aria-label="品牌活动数据">
                <button class="v34-tab active" type="button" data-view-tab="campaigns">品牌活动</button>
                <button class="v34-tab" type="button" data-view-tab="matrix">品牌矩阵号</button>
              </div>

              <div class="v34-campaign-actions">
                <label class="v34-search" for="campaignSearch">
                  <span aria-hidden="true">⌕</span>
                  <input id="campaignSearch" type="search" placeholder="搜索商品、卖点、活动规则" />
                </label>
                <div class="v34-filter-row" id="campaignFilters">
                  <button class="v34-chip-button active" type="button" data-status-filter="all">全部</button>
                  <button class="v34-chip-button" type="button" data-status-filter="active">进行中</button>
                  <button class="v34-chip-button" type="button" data-status-filter="pending">待确认</button>
                  <button class="v34-chip-button" type="button" data-status-filter="confirmed">已确认</button>
                  <button class="v34-chip-button" type="button" data-status-filter="ended">已结束</button>
                  <button class="v34-chip-button" type="button" data-channel-filter="douyin">抖音</button>
                  <button class="v34-chip-button" type="button" data-channel-filter="xhs">小红书</button>
                </div>
                <div class="v34-inline-actions v34-page-actions">
                  <button class="v34-btn primary" type="button" id="openCampaignModal">新增品牌活动</button>
                  <button class="v34-btn" type="button" id="openMatrixModal">新增矩阵号</button>
                </div>
              </div>

              <p class="v34-message" id="campaignMessage"></p>

              <div class="v34-table-wrap" id="campaignTableWrap">
                <table class="v34-table v34-campaign-table">
                  <colgroup>
                    <col style="width: 170px" />
                    <col style="width: 150px" />
                    <col style="width: 190px" />
                    <col style="width: 210px" />
                    <col style="width: 150px" />
                    <col style="width: 130px" />
                    <col style="width: 110px" />
                    <col style="width: 130px" />
                    <col style="width: 140px" />
                    <col style="width: 160px" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th>商品活动</th>
                      <th>品牌 / 渠道</th>
                      <th>核心卖点</th>
                      <th>活动规则</th>
                      <th>价格边界</th>
                      <th>渠道范围</th>
                      <th>状态</th>
                      <th>归属</th>
                      <th>更新时间</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="campaignRows">
                    <tr><td colspan="10"><div class="v34-empty">正在读取品牌活动...</div></td></tr>
                  </tbody>
                </table>
              </div>

              <div class="v34-table-wrap" id="matrixTableWrap" hidden>
                <table class="v34-table v34-campaign-table">
                  <colgroup>
                    <col style="width: 210px" />
                    <col style="width: 110px" />
                    <col style="width: 240px" />
                    <col style="width: 310px" />
                    <col style="width: 120px" />
                    <col style="width: 130px" />
                  </colgroup>
                  <thead>
                    <tr>
                      <th>矩阵号名称</th>
                      <th>平台</th>
                      <th>账号链接</th>
                      <th>定位 / 备注</th>
                      <th>状态</th>
                      <th>归属</th>
                    </tr>
                  </thead>
                  <tbody id="matrixRows">
                    <tr><td colspan="6"><div class="v34-empty">正在读取品牌矩阵号...</div></td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div class="v34-modal-mask" id="campaignModal" hidden>
      <section class="v34-modal" role="dialog" aria-modal="true" aria-labelledby="campaignModalTitle">
        <header class="v34-modal-head">
          <div>
            <h2 id="campaignModalTitle">新增品牌活动</h2>
            <p>脚本生成只读取已确认边界，价格和渠道请尽量写清楚。</p>
          </div>
          <button class="v34-icon-btn" type="button" data-close-modal="campaignModal" aria-label="关闭">×</button>
        </header>
        <form class="v34-modal-body" id="campaignForm">
          <input type="hidden" id="campaignId" />
          <label class="v34-field">商品活动 <input id="campaignName" maxlength="50" placeholder="请输入商品活动名称" required /></label>
          <label class="v34-field">品牌 / 渠道 <input id="campaignBrand" placeholder="例如：安踏 / 抖音" required /></label>
          <label class="v34-field">核心卖点 <textarea id="campaignSellingPoints" maxlength="120" placeholder="输入核心卖点，多个卖点可用逗号分隔" required></textarea></label>
          <label class="v34-field">活动规则 <textarea id="campaignRules" maxlength="160" placeholder="如满减、折扣、赠品、限时规则" required></textarea></label>
          <div class="v34-form-two">
            <label class="v34-field">最低价 <input id="campaignPriceMin" placeholder="例如：199" /></label>
            <label class="v34-field">最高价 <input id="campaignPriceMax" placeholder="例如：499" /></label>
          </div>
          <label class="v34-field">渠道范围 <select id="campaignChannel" required><option value="">请选择适用渠道</option><option value="抖音">抖音</option><option value="小红书">小红书</option><option value="全渠道">全渠道</option><option value="线下门店">线下门店</option></select></label>
          <label class="v34-field">状态 <select id="campaignStatus"><option value="draft">草稿</option><option value="pending">待确认</option><option value="confirmed">已确认</option><option value="ended">已结束</option></select></label>
          <p class="v34-message" id="campaignFormMessage"></p>
        </form>
        <footer class="v34-modal-actions">
          <button class="v34-btn" type="button" data-close-modal="campaignModal">取消</button>
          <button class="v34-btn primary" type="submit" form="campaignForm">保存</button>
        </footer>
      </section>
    </div>

    <div class="v34-modal-mask" id="matrixModal" hidden>
      <section class="v34-modal" role="dialog" aria-modal="true" aria-labelledby="matrixModalTitle">
        <header class="v34-modal-head">
          <div>
            <h2 id="matrixModalTitle">新增矩阵号</h2>
            <p>用于后续选择品牌矩阵号做脚本生成参考。</p>
          </div>
          <button class="v34-icon-btn" type="button" data-close-modal="matrixModal" aria-label="关闭">×</button>
        </header>
        <form class="v34-modal-body" id="matrixForm">
          <label class="v34-field">矩阵号名称 <input id="matrixName" placeholder="请输入账号名称" required /></label>
          <label class="v34-field">平台 <select id="matrixPlatform"><option value="douyin">抖音</option><option value="xiaohongshu">小红书</option><option value="third_party">第三方</option></select></label>
          <label class="v34-field">账号链接 <input id="matrixUrl" placeholder="粘贴主页链接" /></label>
          <label class="v34-field">定位 / 备注 <textarea id="matrixWhy" placeholder="例如：门店号、官方号、导购号、达人合作号"></textarea></label>
          <label class="v34-field">内容标签 <input id="matrixPatterns" placeholder="口播, 探店, 新品" /></label>
          <p class="v34-message" id="matrixFormMessage"></p>
        </form>
        <footer class="v34-modal-actions">
          <button class="v34-btn" type="button" data-close-modal="matrixModal">取消</button>
          <button class="v34-btn primary" type="submit" form="matrixForm">保存</button>
        </footer>
      </section>
    </div>

    <script src="./simple-agent-v3.4-campaigns.js"></script>
  </body>
</html>
