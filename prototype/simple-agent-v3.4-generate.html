<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>脚本生成 v3.4｜内容中台</title>
    <link rel="stylesheet" href="./simple-agent-v3.4.css" />
  </head>
  <body>
    <div class="v34-app" data-page="generate">
      <aside class="v34-side">
        <a class="v34-brand" href="./simple-agent-v3.4-materials.html">
          <span class="v34-brand-mark">中</span>
          <span><strong>内容中台</strong><small>v3.4 简化版</small></span>
        </a>
        <nav class="v34-nav" aria-label="新版本菜单">
          <a href="./simple-agent-v3.4-materials.html"><span class="v34-nav-icon"></span><span>素材库</span></a>
          <a href="./simple-agent-v3.4-campaigns.html"><span class="v34-nav-icon"></span><span>品牌活动</span></a>
          <a class="active" href="./simple-agent-v3.4-generate.html"><span class="v34-nav-icon"></span><span>脚本生成</span></a>
          <a href="./simple-agent-v3.4-scripts.html"><span class="v34-nav-icon"></span><span>脚本库</span></a>
        </nav>
        <div class="v34-version">
          <a class="v34-legacy-link" href="./v1/index.html">查看旧版本</a>
        </div>
      </aside>

      <main class="v34-main">
        <header class="v34-topbar">
          <div class="v34-title">
            <h1>脚本生成</h1>
            <p>确认输入后生成脚本。</p>
          </div>
          <div class="v34-top-actions">
            <div class="v34-user-menu">
              <button class="v34-user" id="userButton" type="button" aria-haspopup="menu" aria-expanded="false">
                <span class="v34-avatar" id="userAvatar">管</span>
                <span id="userName">管理员</span>
                <span class="v34-user-caret" aria-hidden="true"></span>
              </button>
              <div class="v34-user-panel" id="userMenuPanel" role="menu" hidden>
                <div class="v34-user-panel-head">
                  <strong id="userMenuName">管理员</strong>
                  <span id="userMenuMeta">admin</span>
                </div>
                <button class="v34-user-menu-action" id="logoutButton" type="button" role="menuitem">退出登录</button>
              </div>
            </div>
          </div>
        </header>

        <div class="v34-content v34-generate-content">
          <section class="v34-card">
            <div class="v34-card-head">
              <div>
                <h2>生成任务</h2>
                <p>先确认活动和参考素材，再补充本次要求。</p>
              </div>
            </div>
            <div class="v34-card-body v34-generate-form">
              <div class="v34-generate-grid v34-generate-input-grid">
                <label class="v34-field">选择品牌活动 <select id="campaignSelect"></select></label>
                <label class="v34-field">选择参考素材 <button class="v34-select-display" id="openMaterialPicker" type="button">读取素材中...</button></label>
              </div>
              <div class="v34-generate-grid three">
                <label class="v34-field">今日主题 <input id="topicInput" placeholder="例如：夏季运动鞋团购怎么选" /></label>
                <label class="v34-field">脚本条数 <select id="countSelect"><option value="1">1 条</option><option value="2">2 条</option><option value="3" selected>3 条</option><option value="5">5 条</option></select></label>
                <label class="v34-field">生成风格 <select id="styleSelect"><option value="口播导购">口播导购</option><option value="剧情种草">剧情种草</option><option value="到店试穿">到店试穿</option><option value="合规保守">合规保守</option></select></label>
              </div>

              <section class="v34-input-summary" aria-label="输入包摘要">
                <div class="v34-summary-row">
                  <strong>已确认活动</strong>
                  <span id="summaryCampaign">等待选择活动</span>
                </div>
                <div class="v34-summary-row">
                  <strong>参考素材</strong>
                  <span id="summaryMaterials">等待选择素材</span>
                </div>
                <div class="v34-summary-row">
                  <strong>风险规则</strong>
                  <span>不写全网最低，不承诺一定有货</span>
                </div>
              </section>

              <div class="v34-extra-block">
                <div class="v34-extra-head">
                  <strong>补充要求</strong>
                  <span>可选，写本次特别想强调的口径。</span>
                </div>
                <div class="v34-prompt-chips" aria-label="补充要求示例">
                  <button type="button" data-extra-prompt="开头更像真实顾客提问，结尾强调私信确认门店库存">真实顾客提问</button>
                  <button type="button" data-extra-prompt="语气更口语，不要像广告，控制承诺和价格表达">口语不硬广</button>
                  <button type="button" data-extra-prompt="前三秒直接给选择建议，中段用参考素材的节奏，结尾引导到店">前三秒更强</button>
                </div>
                <label class="v34-field"><textarea id="extraInput" class="compact" maxlength="200" placeholder="例如：开头更像真实顾客提问，结尾强调私信确认门店库存"></textarea></label>
              </div>
              <p class="v34-message" id="generateMessage"></p>
              <div class="v34-generate-submit">
                <button class="v34-btn primary v34-generate-btn" id="runGenerate" type="button">生成脚本</button>
              </div>
            </div>
          </section>

          <section class="v34-card">
            <div class="v34-card-head">
              <div>
                <h2>生成结果</h2>
                <p>采用后进入脚本库，待改脚本可继续复盘。</p>
              </div>
            </div>
            <div class="v34-card-body" id="resultList">
              <div class="v34-empty">生成后会显示本次脚本结果。</div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div class="v34-modal-mask" id="materialPickerModal" hidden>
      <section class="v34-modal v34-material-picker-modal" role="dialog" aria-modal="true" aria-labelledby="materialPickerTitle">
        <header class="v34-modal-head">
          <div>
            <h2 id="materialPickerTitle">选择参考素材</h2>
            <p>默认展示素材库中已加入脚本参考的素材。</p>
          </div>
          <button class="v34-icon-btn" type="button" data-close-modal="materialPickerModal" aria-label="关闭">×</button>
        </header>
        <div class="v34-modal-body">
          <div class="v34-table-wrap v34-material-picker-table-wrap" style="margin: 0;">
            <table class="v34-table v34-material-picker-table">
              <colgroup>
                <col style="width: 56px" />
                <col style="width: 58%" />
                <col style="width: 120px" />
                <col style="width: 260px" />
              </colgroup>
              <thead><tr><th>选择</th><th>素材名称</th><th>平台</th><th>标签</th></tr></thead>
              <tbody id="materialPickerRows"></tbody>
            </table>
          </div>
        </div>
        <footer class="v34-modal-actions">
          <button class="v34-btn" type="button" data-close-modal="materialPickerModal">取消</button>
          <button class="v34-btn primary" type="button" id="confirmMaterials">确认选择</button>
        </footer>
      </section>
    </div>

    <script src="./simple-agent-v3.4-generate.js"></script>
  </body>
</html>
