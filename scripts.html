<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>脚本库 v3.5｜内容中台</title>
    <link rel="stylesheet" href="./content-center-v3.5.css" />
  </head>
  <body>
    <div class="cc35-app cc35-app-wide" data-page="scripts">
      <aside class="cc35-side">
        <a class="cc35-brand" href="./materials.html">
          <span class="cc35-brand-mark">中</span>
          <span><strong>内容中台</strong><small>v3.5</small></span>
        </a>
        <nav class="cc35-nav" aria-label="v3.5 预览菜单">
          <a href="./materials.html"><span class="cc35-nav-icon grid" aria-hidden="true"></span><span>素材库</span></a>
          <a href="./campaigns.html"><span class="cc35-nav-icon diamond" aria-hidden="true"></span><span>品牌活动</span></a>
          <a href="./generate.html"><span class="cc35-nav-icon lines" aria-hidden="true"></span><span>脚本生成</span></a>
          <a class="active" href="./scripts.html"><span class="cc35-nav-icon doc" aria-hidden="true"></span><span>脚本库</span></a>
        </nav>
        <div class="cc35-side-foot">
          <a href="./prototype/v1/index.html">查看旧版本</a>
          <button type="button">收起侧边栏</button>
        </div>
      </aside>

      <main class="cc35-main">
        <header class="cc35-topbar">
          <div class="cc35-title">
            <h1>脚本库</h1>
            <p>管理已生成脚本，支持复用、复盘和同步飞书。</p>
          </div>
          <div class="cc35-top-actions">
            <label class="cc35-global-search" for="scriptGlobalSearch">
              <span aria-hidden="true"></span>
              <input id="scriptGlobalSearch" type="search" placeholder="搜索脚本、主题、商品" />
            </label>
            <div class="cc35-user-menu">
              <button class="cc35-user" id="userButton" type="button" aria-haspopup="menu" aria-expanded="false">
                <span class="cc35-avatar" id="userAvatar">管</span>
                <span id="userName">管理员</span>
                <i aria-hidden="true"></i>
              </button>
              <div class="cc35-user-panel" id="userMenuPanel" role="menu" hidden>
                <div><strong id="userMenuName">管理员</strong><span id="userMenuMeta">admin</span></div>
                <button id="logoutButton" type="button" role="menuitem">退出登录</button>
              </div>
            </div>
          </div>
        </header>

        <div class="cc35-content">
          <section class="cc35-panel cc35-scripts-list-card">
            <div class="cc35-panel-head inline">
              <div class="cc35-tabline cc35-script-tabs" aria-label="脚本状态筛选">
                <button class="cc35-tab active" type="button" data-script-status="all">全部</button>
                <button class="cc35-tab" type="button" data-script-status="adopted">已采用</button>
                <button class="cc35-tab" type="button" data-script-status="needs_edit">待改</button>
                <button class="cc35-tab" type="button" data-script-status="sample">样例</button>
                <button class="cc35-tab" type="button" data-script-status="rejected">弃用</button>
              </div>
              <div class="cc35-inline-actions">
                <span class="cc35-script-total" id="scriptCountText">正在读取...</span>
                <button class="cc35-btn secondary" type="button" id="refreshScripts">刷新</button>
              </div>
            </div>
            <div class="cc35-toolbar cc35-toolbar-wrap">
              <label class="cc35-search" for="scriptSearch">
                <span aria-hidden="true"></span>
                <input id="scriptSearch" type="search" placeholder="搜索标题、活动、标签" />
              </label>
              <div class="cc35-filter-row" aria-label="脚本类型筛选">
                <button class="cc35-chip active" type="button" data-script-type="all">全部类型</button>
                <button class="cc35-chip" type="button" data-script-type="口播">口播</button>
                <button class="cc35-chip" type="button" data-script-type="剧情">剧情</button>
                <button class="cc35-chip" type="button" data-script-type="导购">导购</button>
              </div>
              <a class="cc35-btn secondary cc35-feishu-link disabled" id="scriptLibraryLink" href="https://vcnhkiozlu7s.feishu.cn/base/CsDvbgIIlawKgssQl4KcgENZncb" target="_blank" rel="noopener">飞书未配置</a>
            </div>
            <p class="cc35-message" id="scriptMessage"></p>
            <div class="cc35-table-wrap">
              <table class="cc35-table cc35-script-library-table">
                <thead>
                  <tr>
                    <th>脚本标题</th>
                    <th>关联活动</th>
                    <th>类型</th>
                    <th>状态</th>
                    <th>核心结构</th>
                    <th>飞书</th>
                    <th>更新时间</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="scriptRows">
                  <tr><td colspan="8"><div class="cc35-empty">正在读取脚本库...</div></td></tr>
                </tbody>
              </table>
            </div>
            <div class="cc35-pagination">
              <span>脚本列表</span>
              <div><button type="button" disabled>‹</button><button class="active" type="button">1</button><button type="button" disabled>2</button><button type="button" disabled>›</button></div>
              <select aria-label="每页条数"><option>20 条/页</option></select>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div class="cc35-drawer-mask cc35-script-preview-mask" id="scriptPreviewDrawer" hidden>
      <aside class="cc35-script-preview-card" aria-label="脚本预览">
        <header class="cc35-drawer-head">
          <h2>脚本预览</h2>
          <button class="cc35-icon-btn" type="button" id="clearPreview" aria-label="关闭预览">×</button>
        </header>
        <div class="cc35-drawer-body" id="scriptPreviewBody">
          <div class="cc35-empty">选择一条脚本后在这里预览。</div>
        </div>
        <footer class="cc35-drawer-actions cc35-preview-action-footer" id="scriptPreviewActions" hidden>
          <p class="cc35-message" id="previewActionMessage" aria-live="polite"></p>
          <div class="cc35-preview-action-buttons">
            <button class="cc35-btn primary" type="button" data-preview-action="sync">采用并同步飞书</button>
            <button class="cc35-btn secondary" type="button" data-preview-action="needs_edit">标记待改</button>
            <button class="cc35-btn secondary" type="button" data-preview-action="sample">设为样例</button>
            <button class="cc35-btn danger" type="button" data-preview-action="delete">删除脚本</button>
          </div>
        </footer>
      </aside>
    </div>

    <div class="cc35-modal-mask" id="rewriteModal" hidden>
      <section class="cc35-modal" role="dialog" aria-modal="true" aria-labelledby="rewriteModalTitle">
        <header class="cc35-modal-head">
          <div>
            <h2 id="rewriteModalTitle">重写脚本</h2>
            <p id="rewriteModalDesc">保留品牌活动和价格边界，只改表达和结构。</p>
          </div>
          <button class="cc35-icon-btn" type="button" data-close-modal="rewriteModal" aria-label="关闭">×</button>
        </header>
        <div class="cc35-modal-body">
          <label class="cc35-field" for="rewriteFeedback">
            修改要求
            <textarea id="rewriteFeedback" placeholder="例如：开头更像真实顾客提问，结尾更明确引导私信确认门店库存"></textarea>
          </label>
          <p class="cc35-message" id="rewriteMessage"></p>
        </div>
        <footer class="cc35-modal-actions">
          <button class="cc35-btn secondary" type="button" data-close-modal="rewriteModal">取消</button>
          <button class="cc35-btn primary" type="button" id="confirmRewrite">确认重写</button>
        </footer>
      </section>
    </div>

    <script src="./content-center-v3.5-scripts.js?v=summary-detail-v1"></script>
  </body>
</html>
